<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" preserveAspectRatio="xMidYMid meet">
<style>
.topo{animation:drift 22s ease-in-out infinite}
.topo2{animation:drift 28s ease-in-out infinite reverse}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-8px,6px)}}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 12s ease-in-out infinite}
@keyframes draw{0%{stroke-dashoffset:1}35%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}
.route{animation:fade 12s ease-in-out infinite}
@keyframes fade{0%,88%{opacity:1}96%,100%{opacity:0}}
.ring{transform-origin:430px 178px;animation:ping 2.8s ease-out infinite}
@keyframes ping{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.6);opacity:0}}
.pin{transform-origin:430px 178px;animation:bob 4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.draw{stroke-dashoffset:0}}
</style>
