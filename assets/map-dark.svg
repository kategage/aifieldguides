<g class="topo2"><path d="M130 10C120 90 40 120-30 110C-110 100-140 40-125-30C-110-100-30-125 40-115C110-105 138-50 130 10Z" transform="translate(160 380) rotate(18) scale(0.95)" vector-effect="non-scaling-stroke"/><path d="M130 10C120 90 40 120-30 110C-110 100-140 40-125-30C-110-100-30-125 40-115C110-105 138-50 130 10Z" transform="translate(160 380) rotate(18) scale(0.72)" vector-effect="non-scaling-stroke"/><path d="M130 10C120 90 40 120-30 110C-110 100-140 40-125-30C-110-100-30-125 40-115C110-105 138-50 130 10Z" transform="translate(160 380) rotate(18) scale(0.5)" vector-effect="non-scaling-stroke"/><path d="M130 10C120 90 40 120-30 110C-110 100-140 40-125-30C-110-100-30-125 40-115C110-105 138-50 130 10Z" transform="translate(160 380) rotate(18) scale(0.28)" vector-effect="non-scaling-stroke"/></g>
</g>
